name: Validate and Release

on:
  push:
    branches:
      - main
    tags:
      - "release-*"
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run validate:release
      - run: npm run validate:effects
      - run: npm run build
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/release-')
        shell: bash
        run: |
          cp --force marvel-multiverse-compiled.mjs marvel-multiverse.mjs
          VERSION="$(node -p "require('./system.json').version")"
          ZIP_NAME="marvel-multiverse-${VERSION}.zip"
          zip "${ZIP_NAME}" -r assets css fonts icons lang lib packs templates ui \
            marvel-multiverse.mjs marvel-multiverse-compiled.mjs.map \
            CHANGELOG.md LICENSE.txt README.md system.json template.json \
            --exclude "packs/_source/*"
          gh release create "${GITHUB_REF_NAME}" "${ZIP_NAME}" system.json \
            --title "Marvel Multiverse ${VERSION}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
