stages:
  - validate
  - release

default:
  image: node:20-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

validate:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run validate:release
    - npm run validate:effects
    - npm run build

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends ca-certificates curl zip
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run validate:release
    - npm run validate:effects
    - npm run build
    - cp --force marvel-multiverse-compiled.mjs marvel-multiverse.mjs
    - export VERSION="$(node -p "require('./system.json').version")"
    - export ZIP_NAME="marvel-multiverse-${VERSION}.zip"
    - zip "${ZIP_NAME}" -r assets css fonts icons lang lib packs templates ui marvel-multiverse.mjs marvel-multiverse-compiled.mjs.map CHANGELOG.md LICENSE.txt README.md system.json template.json --exclude "packs/_source/*"
    - 'curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${ZIP_NAME}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/marvel-multiverse/${VERSION}/${ZIP_NAME}"'
  artifacts:
    name: "marvel-multiverse-${CI_COMMIT_TAG}"
    paths:
      - marvel-multiverse-*.zip
      - system.json
    expire_in: never
